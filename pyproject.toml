[project]
name = "data-quality-inspector"
version = "0.1.0"
description = "A command-line tool that inspects CSV datasets for data-quality problems."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "PyYAML",
]
[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]